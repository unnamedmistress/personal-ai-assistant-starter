name: Example or documentation problem
description: Report a reproducible problem using fictional data only.
title: "Example problem: "
body:
  - type: markdown
    attributes:
      value: "Do not post credentials, private prompts, client data, or real delivery records. Use SECURITY.md for security concerns."
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and Python version, if relevant.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: File, exact command or fictional example, expected result, and actual result.
    validations:
      required: true
